<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Goodnight Snowy ❤️</title>

  <!-- Beautiful romantic fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 50% 40%, #5c1738 0%, #26091b 40%, #09030a 100%);

      color: white;
    }

    /* Soft glowing background */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;

      background: #ff477e;
      opacity: 0.08;

      border-radius: 50%;
      filter: blur(100px);

      animation: glow 5s infinite alternate;
    }

    .container {
      position: relative;
      z-index: 5;

      text-align: center;

      padding: 40px;
    }

    /* Decorative top text */
    .goodnight {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(24px, 5vw, 38px);

      letter-spacing: 5px;

      color: #ffd7e3;

      margin-bottom: 20px;

      animation: fadeIn 2s ease forwards;
    }

    /* Main LOVE */
    .love {
      font-family: "Great Vibes", cursive;

      font-size: clamp(80px, 17vw, 160px);

      font-weight: 400;

      color: #ff6f9c;

      text-shadow:
        0 0 10px rgba(255, 111, 156, 0.8),
        0 0 30px rgba(255, 71, 126, 0.7),
        0 0 60px rgba(255, 71, 126, 0.4);

      animation:
        heartbeat 2s infinite,
        fadeIn 2s ease forwards;

      line-height: 1;
    }

    /* I love you */
    .subtitle {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(28px, 6vw, 48px);

      letter-spacing: 4px;

      margin-top: 15px;

      color: #fff0f5;

      animation: fadeIn 3s ease forwards;
    }

    /* Goodnight */
    .night {
      font-family: "Great Vibes", cursive;

      font-size: clamp(40px, 8vw, 70px);

      color: #ffb6ca;

      margin-top: 40px;

      text-shadow: 0 0 20px rgba(255, 111, 156, 0.6);

      animation: fadeIn 4s ease forwards;
    }

    .signature {
      font-family: "Cormorant Garamond", serif;

      font-size: 22px;

      letter-spacing: 3px;

      margin-top: 15px;

      color: #ffd9e4;

      animation: fadeIn 5s ease forwards;
    }

    /* Decorative hearts */
    .heart {
      position: absolute;

      color: #ff6f9c;

      font-size: 25px;

      pointer-events: none;

      animation: floatUp linear infinite;

      opacity: 0.8;
    }

    /* Stars */
    .star {
      position: absolute;

      color: #fff;

      font-size: 12px;

      animation: twinkle 2s infinite alternate;
    }

    /* Corner decorations */
    .corner {
      position: fixed;

      font-size: 35px;

      color: #ff8fac;

      opacity: 0.7;
    }

    .top-left {
      top: 30px;
      left: 30px;
    }

    .top-right {
      top: 30px;
      right: 30px;
    }

    .bottom-left {
      bottom: 30px;
      left: 30px;
    }

    .bottom-right {
      bottom: 30px;
      right: 30px;
    }

    /* Animations */

    @keyframes heartbeat {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes glow {

      from {
        transform: scale(0.8);
        opacity: 0.05;
      }

      to {
        transform: scale(1.2);
        opacity: 0.12;
      }

    }

    @keyframes floatUp {

      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      90% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }

    }

    @keyframes twinkle {

      from {
        opacity: 0.2;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1.3);
      }

    }

  </style>
</head>

<body>

  <!-- Corner decorations -->

  <div class="corner top-left">♡</div>
  <div class="corner top-right">♡</div>
  <div class="corner bottom-left">♡</div>
  <div class="corner bottom-right">♡</div>


  <!-- Main message -->

  <div class="container">

    <div class="goodnight">
      Goodnight, Snowy
    </div>

    <div class="love">
      I Love You
    </div>

    <div class="subtitle">
      ❤️
    </div>

    <div class="night">
      Sweet Dreams
    </div>

    <div class="signature">
      — Mulovhedzi
    </div>

  </div>


  <script>

    /* Create floating hearts */

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";

      const hearts = [
        "♡",
        "♥",
        "❤",
        "💕",
        "💗"
      ];

      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.animationDuration =
        (6 + Math.random() * 7) + "s";

      heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 14000);

    }

    setInterval(createHeart, 700);


    /* Create stars */

    function createStar() {

      const star = document.createElement("div");

      star.className = "star";

      star.innerHTML = "✦";

      star.style.left =
        Math.random() * 100 + "vw";

      star.style.top =
        Math.random() * 100 + "vh";

      star.style.animationDelay =
        Math.random() * 3 + "s";

      document.body.appendChild(star);

    }

    for (let i = 0; i < 35; i++) {
      createStar();
    }

  </script>

</body>
</html>
